:root{
  --text:#b3b2cb;          /* цвет подзаголовка и подсказки */
  --logo:#cfd2dc;          /* логотип: слегка сероватый */
  --pumpkin:#ff8a1f;
  --gold:#e8c27a;
  --night:#05080d;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--night); overflow:hidden; }
body{ font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text);
  -webkit-font-smoothing:antialiased; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
img{ display:block; -webkit-user-drag:none; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

#cam{ position:absolute; inset:0; will-change:transform; transform-origin:50% 50%; }
/* ---------- Мир (картинка + окна), размер 2000×1125, масштабируется скриптом ---------- */
#world{ position:absolute; left:0; top:0; width:2000px; height:1125px; transform-origin:0 0; }
#world .bg{ position:absolute; inset:0; width:100%; height:100%; }
#world .vig{ position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 55%, transparent 55%, rgba(2,4,8,.55) 100%); }
#dim{ position:absolute; inset:0; pointer-events:none; transition:opacity 1.4s ease;
  background:radial-gradient(60% 55% at 50% 72%, rgba(0,0,0,.15), rgba(0,0,0,.5) 100%); }
body.playing #dim{ opacity:0; }

.win{ position:absolute; }
.win .glass{ position:absolute; inset:0; overflow:hidden; pointer-events:none;
  clip-path:polygon(0 100%,0 32%,6% 21%,22% 8%,50% 0,78% 8%,94% 21%,100% 32%,100% 100%); }
.win .lit{ position:absolute; inset:0; width:100%; height:100%; opacity:0; transition:opacity .3s ease; }
.win.on .lit{ opacity:1; animation:flick 3.4s infinite; animation-delay:var(--d,0s); }
@keyframes flick{ 0%,100%{filter:brightness(1)} 8%{filter:brightness(.82)} 12%{filter:brightness(1.08)} 40%{filter:brightness(.94)} 70%{filter:brightness(1.05)} }
.win .pk{ position:absolute; left:3%; width:94%; bottom:-2%; transform:translateY(112%);
  transition:transform .22s cubic-bezier(.3,1.5,.5,1); filter:drop-shadow(0 0 10px rgba(255,150,40,.7)); }
.win.has .pk{ transform:translateY(0); }
.win .spill{ position:absolute; left:-80%; right:-80%; top:-25%; bottom:-35%; pointer-events:none; opacity:0;
  transition:opacity .35s ease; mix-blend-mode:screen;
  background:radial-gradient(closest-side, rgba(255,150,40,.5), rgba(255,110,20,.16) 58%, transparent 100%); }
.win.on .spill{ opacity:1; }
.win.miss .glass{ animation:miss .32s; }
@keyframes miss{ 25%{transform:translateX(-3px);filter:brightness(.6)} 75%{transform:translateX(3px)} }
.win .hit{ position:absolute; inset:calc(var(--pad,0px) * -1); border:0; padding:0; background:transparent; cursor:pointer; border-radius:12px;
  outline-offset:2px; }
.win .hit:focus-visible{ outline:3px solid var(--pumpkin); }
body:not(.playing) .win .hit{ pointer-events:none; }

.eyes{ position:absolute; width:0; height:0; opacity:0; pointer-events:none; mix-blend-mode:screen; }

function plural(n, one, few, many){ const m10=n%10, m100=n%100;
  if(m10===1&&m100!==11) return one; if(m10>=2&&m10<=4&&(m100<12||m100>14)) return few; return many; }

/* ---------- масштаб ---------- */
let SCALE = 1, PORTRAIT = false;
const WIN_W = MOBILE ? 74 : 52;                          // ширина окна в единицах мира (для зоны нажатия)
const DOOR_Y = MOBILE ? 1485 : 868;                  // где стоит кнопка «Начать игру» (высота двери)
function layout(){
  const vw = innerWidth, vh = innerHeight;
  PORTRAIT = vw / vh < 0.9;
  document.body.classList.toggle("portrait", PORTRAIT);
  // экран 1
  let s1, tx1, ty1;
  if(MOBILE){
    s1 = Math.max(vw / W1, vh / H1) * 1.42;          // приближаем, чтобы замок и окна были крупнее
    tx1 = (vw - W1 * s1) / 2;
    const cb = $("#counter").getBoundingClientRect().bottom;          // низ счётчика: крыша не должна на него наезжать
    const wanted = vh * .6 - 1120 * s1, roofLimit = cb + 16 - 765 * s1;
    ty1 = Math.min(0, Math.max(vh - H1 * s1, wanted, roofLimit));
  } else if(!PORTRAIT){ s1 = Math.max(vw / W1, vh / H1); tx1 = (vw - W1 * s1) / 2; ty1 = (vh - H1 * s1) / 2; }
  else { s1 = vw / 1240; tx1 = (vw - W1 * s1) / 2; ty1 = vh - H1 * s1; }
  world.style.transform = `translate(${tx1}px,${ty1}px) scale(${s1})`;
  // экран 2
  let s, tx, ty;
  if(MOBILE){ s = Math.max(vw / W2, vh / H2); tx = (vw - W2 * s) / 2; ty = (vh - H2 * s) / 2; }
  else if(!PORTRAIT){ s = Math.max(vw / W, vh / H); tx = (vw - W * s) / 2; ty = (vh - H * s) / 2; }
  else { s = vw / 1240; tx = (vw - W * s) / 2; ty = vh - H * s; }
  SCALE = s1;
  world2.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  // HUD не даём срезать сверху на широких мониторах: при обрезке картинки сдвигаем его вниз (не больше чем на 70 ед.)
  const crop = Math.max(0, -ty / s);
  const th = `translate(${tx}px,${ty + s * Math.min(crop, 70)}px) scale(${s})`;
  const crop1 = Math.max(0, -ty1 / s1);
  hud.style.transform = PORTRAIT ? "" : `translate(${tx1}px,${ty1 + s1 * Math.min(crop1, 70)}px) scale(${s1})`;
  hud2.style.transform = PORTRAIT ? "" : th;
  const st = $("#start");
  st.style.top = PORTRAIT ? (ty1 + DOOR_Y * s1) + "px" : "";
  st.style.transform = PORTRAIT ? "translate(-50%,-50%)" : "";
  // увеличенная зона нажатия окон, чтобы попадать пальцем
  const pad = Math.max(0, Math.min(40, (48 / s1 - WIN_W) / 2));
  world.style.setProperty("--pad", pad + "px");
}
layout();

/* ---------- прелоадер и фоновая подгрузка второго экрана ---------- */
const CRITICAL = [MOBILE ? "bg1m.webp" : "bg1.webp","title.webp","btn.webp","wing.webp","pumpkin.webp","window_lit.webp","counter_full.webp","counter_empty.svg","spider.webp"].map(f => "https://cdn.jsdelivr.net/gh/Malysh92/halloween-pumpkin-night@fae74d2c32644dfc3d1f0d6c86d8f7db1c842c35/assets/" + f);
const SCREEN2_ASSETS = [MOBILE ? "bg2m.webp" : "bg2.webp","ticket_cover.webp","ticket_open.webp","title2.webp","cta.webp"].map(f => "https://cdn.jsdelivr.net/gh/Malysh92/halloween-pumpkin-night@fae74d2c32644dfc3d1f0d6c86d8f7db1c842c35/assets/" + f);
const keepAlive = [];
function loadImg(src, tries = Math.max(3, ASSET_BASES.length * 2)){
  return new Promise(res => {
    let n = 0;
    (function go(){
      const i = new Image();
      i.onload = () => { (i.decode ? i.decode() : Promise.resolve()).catch(() => {}).then(() => res(i)); };
      i.onerror = () => { if(++n < tries) setTimeout(go, 400 * n); else res(i); };   // не сдаёмся с первой ошибки сети
      i.src = n && altUrl(src) ? (n % 2 ? altUrl(src) : src) : src + (n ? (src.includes("?") ? "&" : "?") + "r=" + n : "");
    })();
  });
}
// картинки, которые лежат прямо в разметке первого экрана: ждём, пока они реально загрузятся и расшифруются
function domImgReady(img){
  return new Promise(res => {
    let n = 0; const limit = Math.max(3, ASSET_BASES.length * 2);
    const done = () => { (img.decode ? img.decode() : Promise.resolve()).catch(() => {}).then(res); };
    img.addEventListener("load", done);
    img.addEventListener("error", () => {   // новый адрес подставит общий обработчик выше; тут считаем попытки
      if(++n >= limit) res(); else if(!ASSET_BASES.length){ setTimeout(() => { img.src = img.getAttribute("src") + "?r=" + n; }, 400 * n); }
    });
    if(img.complete && img.naturalWidth) done();
  });
}
(async function preload(){
  const t0 = performance.now(), bar = $("#preBar");
  const domImgs = [...document.querySelectorAll("#world img, #hud img, #wins img")];
  const total = CRITICAL.length + domImgs.length + 1; let done = 0;
  const bump = () => { bar.style.transform = `scaleX(${Math.min(1, ++done / total)})`; };
  const fonts = Promise.race([document.fonts ? Promise.all([document.fonts.load('500 20px Manrope','Аа'), document.fonts.load('800 20px Manrope','Аа'), document.fonts.load('700 20px "Cormorant Garamond"','Аа1')]) : 0, sleep(4000)]).catch(() => {}).then(bump);
  // ждём ВСЁ нужное для первого экрана; страховочный потолок — 60 секунд (на совсем плохой сети)
  await Promise.race([Promise.all([fonts, ...CRITICAL.map(u => loadImg(u).then(bump)), ...domImgs.map(im => domImgReady(im).then(bump))]), sleep(60000)]);
  await sleep(Math.max(0, 650 - (performance.now() - t0)));        // не мигаем, если всё в кэше
  document.body.classList.add("ready"); layout(); $("#pre").classList.add("hide"); setTimeout(() => $("#pre").remove(), 900);
  // пока человек играет, тихо подгружаем второй экран
  setTimeout(() => SCREEN2_ASSETS.forEach(u => loadImg(u).then(i => keepAlive.push(i))), 1500);
})();

const GLASS = [[95,95,100,195],[382,95,101,195],[675,95,100,195],[962,95,103,195],
               [82,395,108,205],[375,395,107,205],[675,395,105,205],[967,395,108,205]];
const GLASS_M = [[65,64,92,166],[310,64,92,166],[62,316,95,176],[308,316,97,176],[58,568,97,176],[310,570,100,174]];
const RECTS = MOBILE ? GLASS_M.map(([x,y,w,h]) => [(486.4+x)/1.28, (1024+y)/1.28, w/1.28, h/1.28])
                     : GLASS.map(([x,y,w,h]) => [(1344+x)/1.92, (845+y)/1.92, w/1.92, h/1.92]);

  el.innerHTML = '<div class="spill"></div><div class="glass"><img class="lit" src="https://cdn.jsdelivr.net/gh/Malysh92/halloween-pumpkin-night@fae74d2c32644dfc3d1f0d6c86d8f7db1c842c35/assets/window_lit.webp" alt="" draggable="false"><img class="pk" src="https://cdn.jsdelivr.net/gh/Malysh92/halloween-pumpkin-night@fae74d2c32644dfc3d1f0d6c86d8f7db1c842c35/assets/pumpkin.webp" alt="" draggable="false"></div><button class="hit" type="button" aria-label="Окно"></button>';
  const w_ = { el, has:false, timer:0 };
  el.querySelector(".hit").addEventListener("pointerdown", e => { e.preventDefault(); tap(w_); });
  el.querySelector(".hit").addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); tap(w_); } });

const setOn = (w, on) => w.el.classList.toggle("on", on);

/* ---------- игра ---------- */
let state = "intro", caught = 0, loopSpawn = 0, loopFlick = 0;

function flicker(){
  const free = wins.filter(w => !w.has);
  const lit = free.filter(w => w.el.classList.contains("on"));
  if(lit.length >= 3 || (lit.length && Math.random() < .5)){ setOn(lit[Math.floor(Math.random()*lit.length)], false); }
  else { setOn(free[Math.floor(Math.random()*free.length)], true); }
}
function activeCount(){ return wins.filter(w => w.has).length; }
function place(w, stay, canHop){
  w.has = true; setOn(w, true); w.el.classList.add("has");
  w.el.querySelector(".hit").setAttribute("aria-label", "Окно с тыквой");
  w.timer = setTimeout(() => {
    // тыква может перепрыгнуть в другое окно, не дожидаясь, пока её поймают
    const free = wins.filter(x => !x.has && x !== w);
    if(canHop && free.length && state === "playing"){
      hide(w, true);
      place(free[Math.floor(Math.random() * free.length)], stay * .7, false);
    } else hide(w, true);
  }, canHop ? stay * .6 : stay);
}
function spawn(){
  if(state !== "playing") return;
  const stay = reduce ? 2200 : Math.max(STAY_MIN, STAY_START - caught * STAY_STEP);
  // с третьей тыквы иногда выглядывают сразу две
  const n = (caught >= 3 && Math.random() < DOUBLE_CHANCE) ? 2 : 1;
  for(let k = 0; k < n && activeCount() < 2; k++){
    const free = wins.filter(w => !w.has);
    if(!free.length) break;
    place(free[Math.floor(Math.random() * free.length)], stay, !reduce && caught >= 2 && Math.random() < HOP_CHANCE);
  }
  loopSpawn = setTimeout(spawn, reduce ? 2400 : Math.max(SPAWN_MIN, SPAWN_START - caught * SPAWN_STEP));
}
function hide(w, maybeOff){
  clearTimeout(w.timer); w.has = false; w.el.classList.remove("has");
  w.el.querySelector(".hit").setAttribute("aria-label", "Окно");
  if(maybeOff && Math.random() < .5) setOn(w, false);
}
function refreshSlots(){ slots.forEach((sl, i) => sl.classList.toggle("on", i < caught)); }
function tap(w){
  if(state !== "playing") return;
  if(w.has){ catchPumpkin(w); return; }
  w.el.classList.remove("miss"); void w.el.offsetWidth; w.el.classList.add("miss"); shake(6);
  if(MISS_PENALTY && caught > 0){
    caught--; refreshSlots();
    hint.textContent = "Мимо! Одна тыква сбежала обратно";
    vib([20, 40, 20]);
  } else hint.textContent = "Мимо. Тыква была не здесь";
}
function catchPumpkin(w){
  const g = w.el.querySelector(".glass").getBoundingClientRect();
  hide(w, false); setOn(w, true); shake(3);
  const idx = caught++;
  flyToSlot(g, slots[Math.min(idx, GOAL - 1)]);
  burst(g.left + g.width/2, g.top + g.height*.6);
  vib(30);
  const left = GOAL - caught;
  hint.textContent = left > 0 ? `Ещё ${left} ${plural(left,"тыква","тыквы","тыкв")}` : "Есть! Открываем подарок…";
  if(caught >= GOAL) finish();
}
function flyToSlot(g, slot){
  const img = document.createElement("img"); img.className = "fly"; img.src = "https://cdn.jsdelivr.net/gh/Malysh92/halloween-pumpkin-night@fae74d2c32644dfc3d1f0d6c86d8f7db1c842c35/assets/pumpkin.webp"; img.alt = "";
  const size = Math.max(50, g.width * 1.0); img.style.width = size + "px";
  fx.appendChild(img);
  const sx = g.left + g.width/2 - size/2, sy = g.top + g.height*.45 - size/2;
  const t = slot.getBoundingClientRect(), k = (t.width * .95) / size;
  const ex = t.left + t.width/2 - size/2, ey = t.top + t.height/2 - size/2;
  const mx = (sx + ex)/2 + (Math.random()<.5?-1:1)*rand(40,110), my = Math.min(sy, ey) - rand(50,120);
  const a = img.animate([
    { transform:`translate(${sx}px,${sy}px) scale(1)`, opacity:1 },
    { transform:`translate(${mx}px,${my}px) scale(${(1+k)/1.6})`, opacity:1, offset:.5 },
    { transform:`translate(${ex}px,${ey}px) scale(${k})`, opacity:1 }
  ], { duration: reduce ? 200 : 780, easing:"cubic-bezier(.45,.05,.55,.95)" });
  a.onfinish = () => { img.remove(); refreshSlots(); };
}
function burst(x, y){
  if(reduce) return;
  for(let i = 0; i < 12; i++){
    const p = document.createElement("div"); p.className = "spark"; fx.appendChild(p);
    const ang = rand(0, Math.PI*2), d = rand(30, 90);
    p.animate([{ transform:`translate(${x}px,${y}px) scale(1)`, opacity:1 },
               { transform:`translate(${x+Math.cos(ang)*d}px,${y+Math.sin(ang)*d-20}px) scale(.2)`, opacity:0 }],
              { duration: rand(450,800), easing:"ease-out" }).onfinish = () => p.remove();
  }
}

/* ---------- старт и музыка ---------- */
let fadeTimer = 0;
function fadeMusic(to, ms){
  clearInterval(fadeTimer); const from = music.volume, t0 = performance.now();
  fadeTimer = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    music.volume = Math.max(0, Math.min(1, from + (to - from) * k));
    if(k >= 1) clearInterval(fadeTimer);
  }, 40);
}
$("#start").addEventListener("click", () => {
  if(state !== "intro") return;
  music.volume = 0; music.play().then(() => fadeMusic(MUSIC_VOLUME, 2500)).catch(() => {});
  begin();
});
sndBtn.addEventListener("click", () => {
  const m = !sndBtn.classList.contains("muted"); sndBtn.classList.toggle("muted", m);
  if(m){ fadeMusic(0, 400); setTimeout(() => { if(sndBtn.classList.contains("muted")) music.pause(); }, 450); }
  else { music.play().catch(()=>{}); fadeMusic(MUSIC_VOLUME, 600); }
});
document.addEventListener("visibilitychange", () => {
  if(document.hidden) music.pause(); else if(state !== "intro" && !sndBtn.classList.contains("muted")) music.play().catch(()=>{});
});

function begin(){

/* ---------- переход на второй экран ---------- */
const BAT_SVG = `<svg viewBox="0 0 120 60"><g transform="translate(0,0)">
  <g class="w"><path d="M58 34C52 22 40 12 20 13c6 4 5 9 8 13C20 24 10 28 2 40c12-3 20-1 27 5 5-6 14-7 22-1 3-4 5-6 7-10z"/></g>
  <g transform="matrix(-1 0 0 1 120 0)"><g class="w"><path d="M58 34C52 22 40 12 20 13c6 4 5 9 8 13C20 24 10 28 2 40c12-3 20-1 27 5 5-6 14-7 22-1 3-4 5-6 7-10z"/></g></g>
  <ellipse cx="60" cy="36" rx="6.5" ry="11"/><path d="M54 27l-2-9 6 5zM66 27l2-9-6 5z"/></g></svg>`;
function flyBats(){
  const box = $("#bats"), vw = innerWidth, vh = innerHeight;
  for(let i = 0; i < 16; i++){
    const b = document.createElement("div"); b.className = "bat"; b.innerHTML = BAT_SVG;
    const w = rand(vw*.04, vw*.11); b.style.width = w + "px"; box.appendChild(b);
    const y0 = rand(vh*.55, vh*1.05), y1 = rand(-vh*.1, vh*.45), mid = rand(vh*.15, vh*.8);
    const x0 = -w - rand(0, vw*.25), x1 = vw + w, dir = Math.random() < .25;
    const A = dir ? x1 : x0, B = dir ? x0 : x1;
    b.style.scale = dir ? "-1 1" : "1 1";
    b.animate([
      { transform:`translate(${A}px,${y0}px)` },

      { transform:`translate(${B}px,${y1}px)` }
    ], { duration: rand(1700, 2900), delay: rand(0, 900), easing:"ease-in-out", fill:"both" }).onfinish = () => b.remove();
  }
}
/* Дым: шейдер с шумом. Чёрные клубы поднимаются снизу, закручиваются и затягивают весь экран; потом рассеиваются. */
const smoke = (() => {
  const cv = document.createElement("canvas"); cv.id = "smoke"; document.body.appendChild(cv);
  const gl = cv.getContext("webgl", { premultipliedAlpha:true, alpha:true });
  let prog, uRes, uT, uC, running = false, cover = 0, tt = 0, last = 0;
  if(gl){
    const vs = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
    const fs = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 res; uniform float t; uniform float cover;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<6;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
void main(){
  vec2 uv = gl_FragCoord.xy / res;
  vec2 p = uv * vec2(res.x/res.y, 1.) * 2.4;
  vec2 q = vec2(fbm(p + vec2(0., -t*.30)), fbm(p + vec2(5.2, 1.3) - t*.22));
  vec2 r = vec2(fbm(p + 2.2*q + vec2(1.7, 9.2) + t*.12), fbm(p + 2.2*q + vec2(8.3, 2.8) - t*.17));
  float n = fbm(p + 2.4*r + vec2(0., -t*.40));
  float low = (0.55 - uv.y) * .85 * (1. - cover);          // дым сначала копится внизу
  float lift = cover * 1.55 - .78 + low;
  float d = smoothstep(.38, .82, n * .92 + .1 + lift);
  float core = smoothstep(.55, 1.05, n + lift);            // плотное чёрное ядро
  vec3 wisp = vec3(.17,.19,.23) * (1. - core) * (.4 + n);
  vec3 col = mix(vec3(.012,.013,.018), wisp, (1. - d*.2) * (1. - core) * .9);
  gl_FragColor = vec4(col * d, d);
}`;
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; };
    prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uRes = gl.getUniformLocation(prog, "res"); uT = gl.getUniformLocation(prog, "t"); uC = gl.getUniformLocation(prog, "cover");

    if(gl){ gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform2f(uRes, cv.width, cv.height); gl.uniform1f(uT, tt); gl.uniform1f(uC, cover); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }

function setupScratch(){
  if(scratchCv.dataset.ready) return; scratchCv.dataset.ready = 1;

  scratchCv.width = CW; scratchCv.height = CH;
  const ctx = scratchCv.getContext("2d");
  const cover = new Image(); cover.src = "https://cdn.jsdelivr.net/gh/Malysh92/halloween-pumpkin-night@fae74d2c32644dfc3d1f0d6c86d8f7db1c842c35/assets/ticket_cover.webp"; cover.onload = () => ctx.drawImage(cover, 0, 0, CW, CH);
  // маленькая копия для подсчёта, сколько стёрто
  const cc = document.createElement("canvas"); cc.width = 85; cc.height = 37; const cctx = cc.getContext("2d");
  cctx.fillStyle = "#000"; cctx.fillRect(0, 0, 85, 37); cctx.strokeStyle = cctx.fillStyle = "#fff"; cctx.lineCap = "round";
  let down = false, last = null, moves = 0, lastFlake = null;
  const pos = e => { const b = scratchCv.getBoundingClientRect(); return { x: (e.clientX - b.left) / b.width * CW, y: (e.clientY - b.top) / b.height * CH }; };
  function stroke(a, b){
    ctx.globalCompositeOperation = "destination-out"; ctx.lineCap = ctx.lineJoin = "round"; ctx.lineWidth = R * 2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.fill();
    cctx.lineWidth = R * 2 / 20; cctx.beginPath(); cctx.moveTo(a.x / 20, a.y / 20); cctx.lineTo(b.x / 20, b.y / 20); cctx.stroke();
    cctx.beginPath(); cctx.arc(b.x / 20, b.y / 20, R / 20, 0, Math.PI * 2); cctx.fill();
  }
  function flakes(e){
    if(reduce) return;
    if(lastFlake && Math.hypot(e.clientX - lastFlake.x, e.clientY - lastFlake.y) < 14) return;
    lastFlake = { x: e.clientX, y: e.clientY };
    for(let i = 0; i < 2; i++){
      const f = document.createElement("div"); f.className = "flake"; fx.appendChild(f);
      const dx = rand(-46, 46), up = rand(10, 40), fall = rand(40, 110), rot = rand(-260, 260);
      f.animate([
        { transform:`translate(${e.clientX}px,${e.clientY}px) rotate(0)`, opacity:1 },
        { transform:`translate(${e.clientX + dx * .6}px,${e.clientY - up}px) rotate(${rot * .5}deg)`, opacity:1, offset:.3 },
        { transform:`translate(${e.clientX + dx}px,${e.clientY + fall}px) rotate(${rot}deg)`, opacity:0 }
      ], { duration: rand(550, 950), easing:"cubic-bezier(.3,.1,.6,1)" }).onfinish = () => f.remove();
    }

  const up = () => { down = false; last = null; if(!revealed && cleared() > .52) reveal(); };
  scratchCv.addEventListener("pointerup", up); scratchCv.addEventListener("pointercancel", () => { down = false; last = null; });

}
function reveal(){

function buildAmbience(amb, cfg){

    const w = rand(.35, .55) * cfg.w; f.style.cssText = `left:${rand(-.1, .75) * cfg.w}px;top:${rand(.73, .9) * cfg.h}px;width:${w}px;height:${w*.28}px`;
    amb.appendChild(f);

  }

    const e = document.createElement("div"); e.className = "ember"; e.style.left = rand(.06, .94) * cfg.w + "px"; e.style.top = rand(.68, .97) * cfg.h + "px"; amb.appendChild(e);
    const dx = rand(-60,60);
    e.animate([{ transform:"translate(0,0) scale(1)", opacity:0 }, { opacity:.9, offset:.2 }, { transform:`translate(${dx}px,${-rand(160,320)}px) scale(.3)`, opacity:0 }],
              { duration: rand(5000,10000), iterations:Infinity, delay:-rand(0,9000), easing:"ease-out" });
  }
  cfg.eyes.forEach(([x,y,k]) => {   // светящиеся глаза: открываются, моргают, закрываются
    const el = document.createElement("div"); el.className = "eyes"; el.style.cssText = `left:${x}px;top:${y}px;transform:scale(${k})`;
    el.innerHTML = "<i></i><i></i>"; amb.appendChild(el);
    const lids = [...el.children];
    if(reduce) return;
    (async function run(){
      await sleep(rand(1500, 14000));
      for(;;){
        if(eyesVisible >= 5){ await sleep(rand(1500, 4000)); continue; }
        eyesVisible++;
        el.animate([{ opacity:0 }, { opacity:1 }], { duration: 600, fill:"forwards" });
        lids.forEach(l => l.animate([{ transform:"scaleY(.05)" }, { transform:"scaleY(1)" }], { duration: 520, easing:"ease-out", fill:"both" }));
        const stay = rand(2500, 7000), t0 = performance.now();

        await el.animate([{ opacity:1 }, { opacity:0 }], { duration: 450, fill:"forwards" }).finished;
        eyesVisible--;
        await sleep(rand(3000, 11000));
      }
    })();
  });
}

// одновременно выползает только один паук, раз в 10–20 секунд
(async function spiderScheduler(){
